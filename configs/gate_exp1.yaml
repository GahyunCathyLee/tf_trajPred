# =========================
# DATA
# =========================
data:
  # exid | highd | combined
  mode: combined

  # window setting
  T: 2
  Tf: 5
  hz: 3
  T_back: 3
  T_front: 1
  vy_eps: 0.27

  batch_size: 512
  num_workers: 128

  roots:
    exid_root: data/exiD
    highd_root: data/highD
    exid_pt_root: data/exiD/data_mmap
    highd_pt_root: data/highD/data_mmap
    combined_root: data/combined

  # scenario labels (optional)
  scenario_labels:
    exid: data/exiD/data_mmap/exid_T2_Tf5_hz3/window_labels.csv
    highd: data/highD/data_mmap/highd_T2_Tf5_hz3/window_labels.csv


# =========================
# FEATURES
# =========================
features:
  use_ego_static: true
  use_nb_static: false
  use_lead: false
  use_lc_state: false
  use_dxtime: false
  use_gate: true
  nb_kin_mode: "pva"


# =========================
# MODEL
# =========================
model:
  name: enc_dec

  T: 6
  Tf: 15
  K: 8

  ego_dim: 23               # 13 + ego_static(10) + ego_lead(5)
  nb_dim: 7                # 6  + nb_static(10) + lc_state(1) + dxtime(1) + gate(1)

  use_neighbors: true

  d_model: 128
  nhead: 4
  enc_layers: 3
  dec_layers: 3
  dropout: 0.0

  predict_delta: false
  M: 6
  return_scores: true


# =========================
# TRAIN
# =========================
train:
  device: cuda
  seed: 42

  epochs: 300
  lr: 3e-4
  weight_decay: 0.0

  use_amp: false
  grad_clip_norm: 1.0

  # loss weights
  w_ade: 1.0
  w_rmse: 1.0
  w_fde: 0.0
  w_cls: 0.1

  # scheduler
  lr_schedule: cosine      # none | cosine
  warmup_steps: 500

  # stats
  stats_split: train

  # logging / ckpt
  monitor: val_ade        # val_loss | val_ade
  ckpt_dir: ckpts/gate_exp/exp1

  stratified_eval: false